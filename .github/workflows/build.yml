name: build-and-test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_NOLOGO: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MajorMode.sln

      - name: Build
        run: dotnet build MajorMode.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/MajorMode.Tests/MajorMode.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Generate sample images
        run: dotnet run --project tools/MajorMode.Samples/MajorMode.Samples.csproj -c Release --no-build -- artifacts/samples --all-formats

      - name: Publish single-file exe
        run: dotnet publish src/MajorMode.App/MajorMode.App.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish/win-x64

      - name: UI smoke test (launch, screenshots)
        shell: powershell
        run: ./tools/ui-smoke.ps1 -Exe publish/win-x64/MajorMode.exe -OutDir artifacts/ui

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: artifacts/ui

      - uses: actions/upload-artifact@v4
        with:
          name: sample-images
          path: artifacts/samples

      - uses: actions/upload-artifact@v4
        with:
          name: MajorMode-win-x64
          path: publish/win-x64
